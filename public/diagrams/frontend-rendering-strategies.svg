<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">Rendering changes when and where work happens</title><desc id="desc">Client rendering waits for code and data in the browser. Server rendering waits for server work before sending HTML. Static generation performs rendering before a request, then serves an artifact.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176448"/></marker></defs><rect width="900" height="440" rx="14" fill="#f7faf8"/><g font-family="system-ui, -apple-system, sans-serif"><text x="28" y="36" font-size="22" fill="#20362c" text-anchor="start" font-weight="650">Rendering changes when and where work happens</text><text x="28" y="135" font-size="19" fill="#20362c" text-anchor="start" font-weight="600">CSR</text><rect x="130" y="100" width="160" height="62" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="210.0" y="130" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">HTML shell</text><path d="M290 131 L315 131" fill="none" stroke="#176448" stroke-width="2" marker-end="url(#arrow)"/><rect x="315" y="100" width="160" height="62" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="395.0" y="130" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">Browser code</text><path d="M475 131 L500 131" fill="none" stroke="#176448" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="100" width="160" height="62" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="580.0" y="130" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">API data</text><path d="M660 131 L685 131" fill="none" stroke="#176448" stroke-width="2" marker-end="url(#arrow)"/><rect x="685" y="100" width="160" height="62" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="765.0" y="130" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">Content</text><text x="28" y="220" font-size="19" fill="#20362c" text-anchor="start" font-weight="600">SSR</text><rect x="130" y="185" width="240" height="62" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="250.0" y="215" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">Server data + render</text><path d="M370 216 L410 216" fill="none" stroke="#176448" stroke-width="2" marker-end="url(#arrow)"/><rect x="410" y="185" width="240" height="62" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="530.0" y="215" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">HTML content</text><path d="M650 216 L685 216" fill="none" stroke="#176448" stroke-width="2" marker-end="url(#arrow)"/><rect x="685" y="185" width="160" height="62" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="765.0" y="215" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">Hydration</text><text x="28" y="305" font-size="19" fill="#20362c" text-anchor="start" font-weight="600">SSG</text><rect x="130" y="270" width="240" height="62" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="250.0" y="300" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">Build beforehand</text><path d="M370 301 L410 301" fill="none" stroke="#176448" stroke-width="2" marker-end="url(#arrow)"/><rect x="410" y="270" width="240" height="62" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="530.0" y="300" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">CDN artifact</text><path d="M650 301 L685 301" fill="none" stroke="#176448" stroke-width="2" marker-end="url(#arrow)"/><rect x="685" y="270" width="160" height="62" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="765.0" y="300" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">Optional JS</text><text x="450" y="380" font-size="17" fill="#52685d" text-anchor="middle" font-weight="400">Regeneration: retain a reusable artifact, then replace it after invalidation.</text><text x="450" y="404" font-size="17" fill="#52685d" text-anchor="middle" font-weight="400">Production freshness and privacy still require explicit cache policies.</text></g></svg>
