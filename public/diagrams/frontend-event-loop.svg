<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title desc"><title id="title">Scheduling creates opportunities, not guaranteed frames</title><desc id="desc">A task runs to completion, promise microtasks are drained, the browser may render, then later tasks can run. A replenished microtask queue can delay the rendering opportunity.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176448"/></marker></defs><rect width="900" height="380" rx="14" fill="#f7faf8"/><g font-family="system-ui, -apple-system, sans-serif"><text x="28" y="36" font-size="22" fill="#20362c" text-anchor="start" font-weight="650">Scheduling creates opportunities, not guaranteed frames</text><rect x="30" y="95" width="185" height="95" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="122.5" y="125" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">Input task</text><text x="122.5" y="152" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">handler runs to end</text><rect x="250" y="95" width="185" height="95" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="342.5" y="125" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">Microtasks</text><text x="342.5" y="152" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">promises drain</text><rect x="470" y="95" width="185" height="95" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="562.5" y="125" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">Render chance</text><text x="562.5" y="152" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">style · layout · paint</text><rect x="690" y="95" width="180" height="95" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="780.0" y="125" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">Later task</text><text x="780.0" y="152" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">timer / other input</text><path d="M215 143 L250 143" fill="none" stroke="#176448" stroke-width="2" marker-end="url(#arrow)"/><path d="M435 143 L470 143" fill="none" stroke="#176448" stroke-width="2" marker-end="url(#arrow)"/><path d="M655 143 L690 143" fill="none" stroke="#176448" stroke-width="2" marker-end="url(#arrow)"/><path d="M342 190 L342 247 L285 247 L285 205" fill="none" stroke="#176448" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="445" y="247" font-size="17" fill="#52685d" text-anchor="start" font-weight="400">New microtasks join this checkpoint</text><text x="450" y="320" font-size="18" fill="#52685d" text-anchor="middle" font-weight="400">Long handlers block later input. Unbounded microtasks can delay rendering.</text><text x="450" y="345" font-size="18" fill="#52685d" text-anchor="middle" font-weight="400">A promise does not move CPU work to another thread.</text></g></svg>
