<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 385" role="img" aria-labelledby="title desc">
<title id="title">Why delete-after-write can refill stale data</title><desc id="desc">A reader obtains version one, a writer commits version two and invalidates the cache, then the delayed reader repopulates version one.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738494"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="384" rx="16" fill="#f6f8fa" stroke="#dce3ea"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="28" y="36" fill="#17212b" font-size="19" font-weight="650" text-anchor="start">Why delete-after-write can refill stale data</text>
<text x="160" y="85" fill="#17212b" font-size="16" font-weight="600" text-anchor="middle">Reader</text><path d="M160 102 V325" stroke="#cbd5df" stroke-width="2" stroke-dasharray="5 5"/><text x="450" y="85" fill="#17212b" font-size="16" font-weight="600" text-anchor="middle">Database</text><path d="M450 102 V325" stroke="#cbd5df" stroke-width="2" stroke-dasharray="5 5"/><text x="740" y="85" fill="#17212b" font-size="16" font-weight="600" text-anchor="middle">Cache</text><path d="M740 102 V325" stroke="#cbd5df" stroke-width="2" stroke-dasharray="5 5"/><path d="M160,125 L450,125" fill="none" stroke="#738494" stroke-width="2" marker-end="url(#arrow)"/><text x="180" y="117" fill="#17212b" font-size="13" font-weight="400" text-anchor="start">miss → read version 1</text><rect x="327" y="157" width="246" height="47" rx="10" fill="#eaf5f2" stroke="#8fbfb4"/><text x="450.0" y="185.5" fill="#17212b" font-size="16" font-weight="600" text-anchor="middle">Writer commits version 2</text><path d="M450,230 L740,230" fill="none" stroke="#738494" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="221" fill="#17212b" font-size="13" font-weight="400" text-anchor="start">writer invalidates</text><path d="M160,285 L740,285" fill="none" stroke="#738494" stroke-width="2" marker-end="url(#arrow)"/><text x="243" y="276" fill="#9f3d35" font-size="14" font-weight="400" text-anchor="start">delayed reader fills version 1</text><text x="28" y="357" fill="#516170" font-size="15" font-weight="400" text-anchor="start">An invalidation does not order a concurrent stale fill.</text>
</g></svg>
