<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-labelledby="title description">
<title id="title">Test the product decision</title><desc id="description">An experiment assigns users to control or treatment. Compare a retention outcome with a reliability guardrail before choosing whether to roll out.</desc>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#000000" opacity=".09"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="m1 1 8 4-8 4" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#000000}.label{font-size:21px;font-weight:500}.small{font-size:17px}.mono{font:18px 'Courier New',monospace}.number{font:22px 'Courier New',monospace}.ghost-number{font:22px 'Courier New',monospace;fill:#000000;opacity:.3}.heading{font-size:18px;letter-spacing:.1px}.emphasis{font-weight:700}.panel{fill:#ffffff;stroke:#000000;stroke-width:1.5}.wash{fill:#e5e5e5;stroke:#000000;stroke-width:1.2}.faint{fill:#f7f7f7;stroke:#000000;stroke-opacity:.17;stroke-width:1.2}.selected{fill:#d4d4d4;stroke:#000000;stroke-width:1.5}.solid{fill:#000000}.muted-fill{fill:#000000;opacity:.35}.accent-fill{fill:#d4d4d4}.shadow{fill:#000000;opacity:.07;stroke:none}.wire,.hair,.outcome,.grid{fill:none;stroke:#000000;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.hair{stroke-width:1;opacity:.55}.grid{stroke-width:1;opacity:.12}.dashed{stroke-dasharray:5 6}.outcome{stroke:#4e7067;stroke-width:3}</style>
<rect width="600" height="340" rx="10" fill="#f7f7f7"/><rect x="18" y="63" width="564" height="258" fill="url(#dots)"/>
<text x="29" y="36" class="heading" text-anchor="start">Test the product decision</text><path d="M29 51H571V51" class="hair"/>
<text x="40" y="94" class="mono" text-anchor="start">experiment</text><circle cx="70" cy="151" r="15" class="wash"/><circle cx="111" cy="151" r="15" class="wash"/><circle cx="151" cy="151" r="15" class="wash"/><path d="M90 173v27h-27v26" class="wire" marker-end="url(#arrow)"/><path d="M132 173v27h41v26" class="wire" marker-end="url(#arrow)"/><rect x="34" y="241" width="103" height="48" rx="5" class="shadow"/><rect x="30" y="236" width="103" height="48" rx="5" class="panel"/><text x="81.5" y="267" class="label" text-anchor="middle">control</text><rect x="152" y="241" width="119" height="48" rx="5" class="shadow"/><rect x="148" y="236" width="119" height="48" rx="5" class="panel"/><text x="207.5" y="267" class="label" text-anchor="middle">treatment</text><path d="M291 108v167M316 261h244M316 261V119" class="hair"/><text x="333" y="99" class="small" text-anchor="start">retention</text><path d="M327 147c25 19 23 59 59 64s74 11 159 11" class="wire dashed"/><path d="M327 147c25 16 23 44 59 47s74 1 159-5" class="outcome"/><text x="486" y="177" class="small" text-anchor="start">treatment</text><text x="492" y="245" class="small" text-anchor="start">control</text><rect x="335" y="287" width="220" height="30" rx="4" class="panel"/><circle cx="352" cy="302" r="4" class="solid"/><text x="369" y="309" class="small" text-anchor="start">guardrail: errors</text>
</svg>
