<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" role="img" aria-labelledby="title desc">
<title id="title">Trace the request, not only the handler</title><desc id="desc">Five request boundaries share one deadline; timing must include queues outside application code.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738494"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="269" rx="16" fill="#f6f8fa" stroke="#dce3ea"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="28" y="36" fill="#17212b" font-size="19" font-weight="650" text-anchor="start">Trace the request, not only the handler</text>
<rect x="28" y="76" width="140" height="78" rx="10" fill="#ffffff" stroke="#cbd5df"/><text x="98.0" y="115.0" fill="#17212b" font-size="16" font-weight="600" text-anchor="middle">Client</text><text x="98.0" y="136.0" fill="#516170" font-size="12" font-weight="400" text-anchor="middle">request + deadline</text><path d="M172,115 L196,115" fill="none" stroke="#738494" stroke-width="2" marker-end="url(#arrow)"/><rect x="204" y="76" width="140" height="78" rx="10" fill="#ffffff" stroke="#cbd5df"/><text x="274.0" y="115.0" fill="#17212b" font-size="16" font-weight="600" text-anchor="middle">DNS / TLS</text><text x="274.0" y="136.0" fill="#516170" font-size="12" font-weight="400" text-anchor="middle">connection setup</text><path d="M348,115 L372,115" fill="none" stroke="#738494" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="76" width="140" height="78" rx="10" fill="#ffffff" stroke="#cbd5df"/><text x="450.0" y="115.0" fill="#17212b" font-size="16" font-weight="600" text-anchor="middle">Ingress</text><text x="450.0" y="136.0" fill="#516170" font-size="12" font-weight="400" text-anchor="middle">routing + limits</text><path d="M524,115 L548,115" fill="none" stroke="#738494" stroke-width="2" marker-end="url(#arrow)"/><rect x="556" y="76" width="140" height="78" rx="10" fill="#ffffff" stroke="#cbd5df"/><text x="626.0" y="115.0" fill="#17212b" font-size="16" font-weight="600" text-anchor="middle">Application</text><text x="626.0" y="136.0" fill="#516170" font-size="12" font-weight="400" text-anchor="middle">admission + handler</text><path d="M700,115 L724,115" fill="none" stroke="#738494" stroke-width="2" marker-end="url(#arrow)"/><rect x="732" y="76" width="140" height="78" rx="10" fill="#ffffff" stroke="#cbd5df"/><text x="802.0" y="115.0" fill="#17212b" font-size="16" font-weight="600" text-anchor="middle">Database</text><text x="802.0" y="136.0" fill="#516170" font-size="12" font-weight="400" text-anchor="middle">pool + locks + query</text><path d="M35 178 H865 M35 171 V185 M865 171 V185" stroke="#0f766e" stroke-width="2"/><text x="450" y="207" fill="#0f766e" font-size="15" font-weight="400" text-anchor="middle">One useful-work budget crosses every queue and dependency.</text><text x="28" y="244" fill="#516170" font-size="14" font-weight="400" text-anchor="start">Measure connection time, ingress wait, pool wait, and execution separately.</text>
</g></svg>
