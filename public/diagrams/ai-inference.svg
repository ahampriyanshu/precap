<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
<title id="title">Inference has a queue, a prompt phase, and sequential decode</title><desc id="desc">A horizontal timeline shows admission and queueing, prefill, first token, then repeated decode steps. Prefill emphasizes prompt computation; decode reuses KV state and reads weights and cache. Cancellation should end remaining work.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#526176"/></marker></defs>
<rect width="900" height="390" rx="18" fill="#f8fafc"/>
<g font-family="system-ui,-apple-system,sans-serif">
<text x="28" y="36" fill="#172033" font-size="21" font-weight="650">Inference has a queue, a prompt phase, and sequential decode</text>
<rect x="28" y="91" width="170" height="99" rx="10" fill="white" stroke="#cbd5e1"/>
<text x="113.0" y="118" text-anchor="middle" fill="#172033" font-size="17" font-weight="650">Queue / admission</text>
<text x="113.0" y="142" text-anchor="middle" fill="#526176" font-size="15">deadlines + capacity</text>
<text x="113.0" y="164" text-anchor="middle" fill="#526176" font-size="15">no unbounded backlog</text>
<rect x="234" y="91" width="205" height="99" rx="10" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="336.5" y="118" text-anchor="middle" fill="#172033" font-size="17" font-weight="650">Prefill</text>
<text x="336.5" y="142" text-anchor="middle" fill="#526176" font-size="15">process known prompt</text>
<text x="336.5" y="164" text-anchor="middle" fill="#526176" font-size="15">create key/value state</text>
<rect x="475" y="91" width="170" height="99" rx="10" fill="#ccfbf1" stroke="#cbd5e1"/>
<text x="560.0" y="118" text-anchor="middle" fill="#172033" font-size="17" font-weight="650">First token</text>
<text x="560.0" y="142" text-anchor="middle" fill="#526176" font-size="15">TTFT observed</text>
<text x="560.0" y="164" text-anchor="middle" fill="#526176" font-size="15">stream begins</text>
<rect x="681" y="91" width="191" height="99" rx="10" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="776.5" y="118" text-anchor="middle" fill="#172033" font-size="17" font-weight="650">Decode…</text>
<text x="776.5" y="142" text-anchor="middle" fill="#526176" font-size="15">one next-token step</text>
<text x="776.5" y="164" text-anchor="middle" fill="#526176" font-size="15">per iteration</text>
<path d="M198 140 L234 140" fill="none" stroke="#526176" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M439 140 L475 140" fill="none" stroke="#526176" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M645 140 L681 140" fill="none" stroke="#526176" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="234" y="239" width="205" height="84" rx="10" fill="white" stroke="#cbd5e1"/>
<text x="336.5" y="266" text-anchor="middle" fill="#172033" font-size="17" font-weight="650">Main pressures</text>
<text x="336.5" y="290" text-anchor="middle" fill="#526176" font-size="15">prompt work + kernels</text>
<rect x="625" y="239" width="247" height="84" rx="10" fill="white" stroke="#cbd5e1"/>
<text x="748.5" y="266" text-anchor="middle" fill="#172033" font-size="17" font-weight="650">Main pressures</text>
<text x="748.5" y="290" text-anchor="middle" fill="#526176" font-size="15">KV/weight traffic + schedule</text>
<path d="M337 190 L337 239" fill="none" stroke="#526176" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<path d="M777 190 L750 239" fill="none" stroke="#526176" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="28" y="360" fill="#526176" font-size="15" text-anchor="start">Measure TTFT, inter-token latency, completion tails, active KV, and useful outcomes under realistic load.</text>
</g></svg>