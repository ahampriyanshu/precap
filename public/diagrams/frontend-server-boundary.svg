<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Keep the browser boundary deliberate</title><desc id="desc">Data access and presentation remain in the server module graph. Only authorized serialized data and the interactive client implementation cross into the browser graph.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176448"/></marker></defs><rect width="900" height="430" rx="14" fill="#f7faf8"/><g font-family="system-ui, -apple-system, sans-serif"><text x="28" y="36" font-size="22" fill="#20362c" text-anchor="start" font-weight="650">Keep the browser boundary deliberate</text><rect x="30" y="82" width="360" height="250" rx="12" fill="#eef3f0" stroke="#b5c8bd"/><text x="210" y="118" font-size="21" fill="#20362c" text-anchor="middle" font-weight="600">Server graph</text><rect x="65" y="145" width="290" height="80" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="210.0" y="175" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">Data + presentation</text><text x="210.0" y="202" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">authorize before serialization</text><text x="210" y="273" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">Secrets and database clients</text><text x="210" y="296" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">stay in the server environment</text><rect x="510" y="82" width="360" height="250" rx="12" fill="#e5f1e9" stroke="#b5c8bd"/><text x="690" y="118" font-size="21" fill="#20362c" text-anchor="middle" font-weight="600">Browser graph</text><rect x="545" y="145" width="290" height="80" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="690.0" y="175" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">Interactive leaf</text><text x="690.0" y="202" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">state · events · browser APIs</text><text x="690" y="273" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">Receives authorized data</text><text x="690" y="296" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">and client component code</text><path d="M390 183 L510 183" fill="none" stroke="#176448" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="243" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">public</text><text x="450" y="266" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">payload</text><text x="450" y="382" font-size="18" fill="#52685d" text-anchor="middle" font-weight="400">Client Components may also contribute initial server-rendered HTML.</text></g></svg>
