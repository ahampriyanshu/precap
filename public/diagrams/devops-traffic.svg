<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" aria-labelledby="title desc"><title id="title">A request crosses several independent boundaries</title><desc id="desc">DNS resolution precedes the request. TLS ends at the ingress in this example; private forwarding reaches an app and database.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#53684c"/></marker></defs><rect width="760" height="410" fill="#fff"/><text x="30" y="37" font-family="system-ui,sans-serif" font-size="19" font-weight="600" fill="#253a24">A request crosses several independent boundaries</text><rect x="30" y="85" width="190" height="75" rx="7" fill="#f2f5ec" stroke="#b6c7ab"/><text x="125.0" y="114" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#253a24">Browser</text><text x="125.0" y="137" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">name and request</text><rect x="280" y="85" width="190" height="75" rx="7" fill="#f2f5ec" stroke="#b6c7ab"/><text x="375.0" y="114" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#253a24">DNS resolver</text><text x="375.0" y="137" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">cached destination</text><rect x="530" y="85" width="200" height="75" rx="7" fill="#f2f5ec" stroke="#b6c7ab"/><text x="630.0" y="114" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#253a24">TLS ingress</text><text x="630.0" y="137" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">certificate + routing</text><rect x="530" y="265" width="200" height="75" rx="7" fill="#f2f5ec" stroke="#b6c7ab"/><text x="630.0" y="294" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#253a24">Application</text><text x="630.0" y="317" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">admission + handlers</text><rect x="240" y="265" width="210" height="75" rx="7" fill="#f2f5ec" stroke="#b6c7ab"/><text x="345.0" y="294" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#253a24">Database</text><text x="345.0" y="317" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">durable state</text><path d="M220 120H278" fill="none" stroke="#53684c" stroke-width="1.7" marker-end="url(#arrow)"/><text x="250" y="104" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">resolve</text><path d="M470 120H528" fill="none" stroke="#53684c" stroke-width="1.7" marker-end="url(#arrow)"/><text x="500" y="104" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">address</text><path d="M630 160V263" fill="none" stroke="#53684c" stroke-width="1.7" marker-end="url(#arrow)"/><text x="679" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">HTTPS route</text><path d="M530 302H452" fill="none" stroke="#53684c" stroke-width="1.7" marker-end="url(#arrow)"/><text x="490" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">private</text><path d="M125 160V210H575V263" fill="none" stroke="#53684c" stroke-width="1.7" marker-end="url(#arrow)"/><text x="330" y="198" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">connect to the resolved ingress</text></svg>