<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title desc"><title id="title">“The cache” is several independent policies</title><desc id="desc">Responses may pass through shared CDN, browser HTTP cache, application query cache, and view state. Each has different identity, freshness, and invalidation semantics.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176448"/></marker></defs><rect width="900" height="380" rx="14" fill="#f7faf8"/><g font-family="system-ui, -apple-system, sans-serif"><text x="28" y="36" font-size="22" fill="#20362c" text-anchor="start" font-weight="650">“The cache” is several independent policies</text><rect x="25" y="100" width="190" height="120" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="120.0" y="130" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">Shared CDN</text><text x="120.0" y="157" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">Public variants</text><text x="120.0" y="180" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">edge freshness</text><rect x="245" y="100" width="190" height="120" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="340.0" y="130" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">Browser HTTP</text><text x="340.0" y="157" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">URL + headers</text><text x="340.0" y="180" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">validators / age</text><rect x="465" y="100" width="190" height="120" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="560.0" y="130" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">Query cache</text><text x="560.0" y="157" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">tenant + query</text><text x="560.0" y="180" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">staleness / invalidation</text><rect x="685" y="100" width="190" height="120" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="780.0" y="130" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">View state</text><text x="780.0" y="157" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">active selection</text><text x="780.0" y="180" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">pending / accepted</text><path d="M215 160 L245 160" fill="none" stroke="#176448" stroke-width="2" marker-end="url(#arrow)"/><path d="M435 160 L465 160" fill="none" stroke="#176448" stroke-width="2" marker-end="url(#arrow)"/><path d="M655 160 L685 160" fill="none" stroke="#176448" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="270" font-size="20" fill="#20362c" text-anchor="middle" font-weight="600">Every layer needs its own identity and lifetime.</text><text x="450" y="310" font-size="18" fill="#52685d" text-anchor="middle" font-weight="400">Invalidating one layer does not automatically invalidate the others.</text><text x="450" y="335" font-size="18" fill="#52685d" text-anchor="middle" font-weight="400">A user or tenant change must not reuse another identity’s representation.</text></g></svg>
