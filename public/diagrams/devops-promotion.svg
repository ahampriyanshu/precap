<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" aria-labelledby="title desc"><title id="title">Build once, promote an artifact identity</title><desc id="desc">Verification and build produce an artifact digest; staging and production use that identity with independently reviewed runtime configuration.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#53684c"/></marker></defs><rect width="760" height="410" fill="#fff"/><text x="30" y="37" font-family="system-ui,sans-serif" font-size="19" font-weight="600" fill="#253a24">Build once, promote an artifact identity</text><rect x="30" y="85" width="195" height="75" rx="7" fill="#f2f5ec" stroke="#b6c7ab"/><text x="127.5" y="114" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#253a24">Source revision</text><text x="127.5" y="137" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">reviewed commit</text><rect x="280" y="85" width="195" height="75" rx="7" fill="#f2f5ec" stroke="#b6c7ab"/><text x="377.5" y="114" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#253a24">Verify and build</text><text x="377.5" y="137" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">isolated inputs</text><rect x="530" y="85" width="200" height="75" rx="7" fill="#f2f5ec" stroke="#b6c7ab"/><text x="630.0" y="114" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#253a24">Artifact registry</text><text x="630.0" y="137" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">content digest</text><rect x="530" y="270" width="200" height="75" rx="7" fill="#f2f5ec" stroke="#b6c7ab"/><text x="630.0" y="299" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#253a24">Staging / canary</text><text x="630.0" y="322" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">outcome checks</text><rect x="250" y="270" width="200" height="75" rx="7" fill="#f2f5ec" stroke="#b6c7ab"/><text x="350.0" y="299" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#253a24">Production</text><text x="350.0" y="322" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">same digest</text><path d="M225 122H278" fill="none" stroke="#53684c" stroke-width="1.7" marker-end="url(#arrow)"/><text x="250" y="106" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">CI</text><path d="M475 122H528" fill="none" stroke="#53684c" stroke-width="1.7" marker-end="url(#arrow)"/><text x="500" y="106" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">publish</text><path d="M630 160V268" fill="none" stroke="#53684c" stroke-width="1.7" marker-end="url(#arrow)"/><text x="678" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">deploy</text><path d="M530 307H452" fill="none" stroke="#53684c" stroke-width="1.7" marker-end="url(#arrow)"/><text x="490" y="292" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">promote</text><path d="M100 220H350V268" fill="none" stroke="#53684c" stroke-width="1.7" marker-end="url(#arrow)"/><text x="210" y="207" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">configuration revision joins at deploy</text></svg>