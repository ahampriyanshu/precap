<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 325" role="img" aria-labelledby="title desc">
<title id="title">The last-unit reservation race</title><desc id="desc">Two independent reads can both approve the last unit. A conditional update permits only one reservation and rechecks after a concurrent update.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738494"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="324" rx="16" fill="#f6f8fa" stroke="#dce3ea"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="28" y="36" fill="#17212b" font-size="19" font-weight="650" text-anchor="start">The last-unit reservation race</text>
<text x="28" y="80" fill="#9f3d35" font-size="16" font-weight="600" text-anchor="start">Unsafe: separate read and write</text><text x="480" y="80" fill="#0f766e" font-size="16" font-weight="600" text-anchor="start">Safe: condition and mutation together</text><path d="M450 66 V293" stroke="#d4dde5" stroke-width="1"/><text x="28" y="120" fill="#17212b" font-size="15" font-weight="400" text-anchor="start">A reads stock = 1</text><text x="480" y="120" fill="#17212b" font-size="15" font-weight="400" text-anchor="start">A: decrement WHERE stock ≥ 1</text><text x="28" y="160" fill="#17212b" font-size="15" font-weight="400" text-anchor="start">B reads stock = 1</text><text x="480" y="160" fill="#17212b" font-size="15" font-weight="400" text-anchor="start">A commits; stock = 0</text><text x="28" y="200" fill="#17212b" font-size="15" font-weight="400" text-anchor="start">A accepts; B accepts</text><text x="480" y="200" fill="#17212b" font-size="15" font-weight="400" text-anchor="start">B rechecks condition after waiting</text><text x="28" y="240" fill="#17212b" font-size="15" font-weight="400" text-anchor="start">Two orders for one unit</text><text x="480" y="240" fill="#17212b" font-size="15" font-weight="400" text-anchor="start">B updates zero rows; reject reservation</text><text x="28" y="294" fill="#516170" font-size="14" font-weight="400" text-anchor="start">The database must enforce the decision at the write boundary.</text>
</g></svg>
