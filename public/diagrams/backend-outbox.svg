<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 357" role="img" aria-labelledby="title desc">
<title id="title">Persist intent; expect replay at every handoff</title><desc id="desc">The business record and outbox event commit atomically. The relay and broker can repeat publication. Consumers deduplicate atomically with their durable effect.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738494"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="356" rx="16" fill="#f6f8fa" stroke="#dce3ea"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="28" y="36" fill="#17212b" font-size="19" font-weight="650" text-anchor="start">Persist intent; expect replay at every handoff</text>
<rect x="28" y="76" width="230" height="138" rx="12" fill="#eaf5f2" stroke="#8fbfb4"/><text x="143" y="105" fill="#0f766e" font-size="15" font-weight="600" text-anchor="middle">One DB transaction</text><text x="143" y="141" fill="#17212b" font-size="16" font-weight="600" text-anchor="middle">Order + outbox event</text><text x="143" y="180" fill="#516170" font-size="14" font-weight="400" text-anchor="middle">COMMIT together</text><rect x="336" y="101" width="185" height="88" rx="10" fill="#ffffff" stroke="#cbd5df"/><text x="428.5" y="145.0" fill="#17212b" font-size="16" font-weight="600" text-anchor="middle">Relay / broker</text><text x="428.5" y="166.0" fill="#516170" font-size="12" font-weight="400" text-anchor="middle">confirm + possible repeat</text><rect x="607" y="101" width="265" height="88" rx="10" fill="#ffffff" stroke="#cbd5df"/><text x="739.5" y="145.0" fill="#17212b" font-size="16" font-weight="600" text-anchor="middle">Consumer transaction</text><text x="739.5" y="166.0" fill="#516170" font-size="12" font-weight="400" text-anchor="middle">dedupe marker + durable effect</text><path d="M266,145 L326,145" fill="none" stroke="#738494" stroke-width="2" marker-end="url(#arrow)"/><path d="M529,145 L597,145" fill="none" stroke="#738494" stroke-width="2" marker-end="url(#arrow)"/><text x="28" y="259" fill="#516170" font-size="14" font-weight="400" text-anchor="start">Publish succeeded but progress was not saved? Publish may repeat.</text><text x="28" y="287" fill="#516170" font-size="14" font-weight="400" text-anchor="start">Effect committed but acknowledgement was lost? Delivery may repeat.</text><text x="28" y="329" fill="#0f766e" font-size="15" font-weight="400" text-anchor="start">Exactly-once business effects need an explicit boundary, not a broker label.</text>
</g></svg>
