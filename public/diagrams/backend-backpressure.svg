<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 315" role="img" aria-labelledby="title desc">
<title id="title">Bound work before the scarce dependency</title><desc id="desc">Admission has a limited wait budget; execution slots feed a globally budgeted dependency pool, while excess work is rejected.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738494"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="314" rx="16" fill="#f6f8fa" stroke="#dce3ea"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="28" y="36" fill="#17212b" font-size="19" font-weight="650" text-anchor="start">Bound work before the scarce dependency</text>
<rect x="28" y="82" width="190" height="88" rx="10" fill="#ffffff" stroke="#cbd5df"/><text x="123.0" y="126.0" fill="#17212b" font-size="16" font-weight="600" text-anchor="middle">Admission</text><text x="123.0" y="147.0" fill="#516170" font-size="12" font-weight="400" text-anchor="middle">bounded waiting + deadline</text><rect x="315" y="82" width="225" height="88" rx="10" fill="#ffffff" stroke="#cbd5df"/><text x="427.5" y="126.0" fill="#17212b" font-size="16" font-weight="600" text-anchor="middle">Execution slots</text><text x="427.5" y="147.0" fill="#516170" font-size="12" font-weight="400" text-anchor="middle">threads / tasks / processes</text><rect x="637" y="82" width="235" height="88" rx="10" fill="#eaf5f2" stroke="#8fbfb4"/><text x="754.5" y="126.0" fill="#17212b" font-size="16" font-weight="600" text-anchor="middle">Dependency pool</text><text x="754.5" y="147.0" fill="#516170" font-size="12" font-weight="400" text-anchor="middle">smaller global resource budget</text><path d="M224,126 L305,126" fill="none" stroke="#738494" stroke-width="2" marker-end="url(#arrow)"/><path d="M546,126 L627,126" fill="none" stroke="#738494" stroke-width="2" marker-end="url(#arrow)"/><path d="M123 175 V227 H337" fill="none" stroke="#b4534b" stroke-width="2"/><text x="350" y="232" fill="#9f3d35" font-size="15" font-weight="400" text-anchor="start">Reject promptly when the waiting budget is exhausted</text><text x="28" y="284" fill="#516170" font-size="15" font-weight="400" text-anchor="start">An unlimited queue in front of a semaphore is still unlimited work.</text>
</g></svg>
