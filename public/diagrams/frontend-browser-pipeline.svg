<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-labelledby="title desc"><title id="title">A page becomes useful through dependencies</title><desc id="desc">HTML discovery creates parallel resource work; DOM, styles, layout, paint and compositing determine visible output. JavaScript may alter the DOM and block the main thread.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176448"/></marker></defs><rect width="900" height="410" rx="14" fill="#f7faf8"/><g font-family="system-ui, -apple-system, sans-serif"><text x="28" y="36" font-size="22" fill="#20362c" text-anchor="start" font-weight="650">A page becomes useful through dependencies</text><rect x="28" y="78" width="160" height="86" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="108.0" y="108" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">Navigation</text><text x="108.0" y="135" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">DNS · connection</text><rect x="240" y="78" width="160" height="86" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="320.0" y="108" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">HTML</text><text x="320.0" y="135" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">incremental parse</text><path d="M188 121 L240 121" fill="none" stroke="#176448" stroke-width="2" marker-end="url(#arrow)"/><rect x="450" y="78" width="170" height="86" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="535.0" y="108" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">CSS</text><text x="535.0" y="135" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">style rules</text><path d="M400 121 L450 121" fill="none" stroke="#176448" stroke-width="2" marker-end="url(#arrow)"/><rect x="650" y="78" width="170" height="86" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="735.0" y="108" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">JavaScript</text><text x="735.0" y="135" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">parse / execute</text><path d="M320 78 L320 62 L735 62 L735 78" fill="none" stroke="#176448" stroke-width="2" marker-end="url(#arrow)"/><rect x="240" y="220" width="170" height="86" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="325.0" y="250" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">DOM</text><text x="325.0" y="277" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">document tree</text><rect x="450" y="220" width="170" height="86" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="535.0" y="250" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">Style + layout</text><text x="535.0" y="277" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">computed geometry</text><rect x="650" y="220" width="170" height="86" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="735.0" y="250" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">Paint + composite</text><text x="735.0" y="277" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">visible frame</text><path d="M325 164 L325 220" fill="none" stroke="#176448" stroke-width="2" marker-end="url(#arrow)"/><path d="M410 263 L450 263" fill="none" stroke="#176448" stroke-width="2" marker-end="url(#arrow)"/><path d="M620 263 L650 263" fill="none" stroke="#176448" stroke-width="2" marker-end="url(#arrow)"/><path d="M535 164 L535 220" fill="none" stroke="#176448" stroke-width="2" marker-end="url(#arrow)"/><path d="M735 164 L735 190 L325 190 L325 220" fill="none" stroke="#176448" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="450" y="350" font-size="17" fill="#52685d" text-anchor="middle" font-weight="400">Images and fonts are discovered along the way.</text><text x="450" y="374" font-size="17" fill="#52685d" text-anchor="middle" font-weight="400">Late discovery adds dependencies; JavaScript can delay parsing or frames.</text></g></svg>
