<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">Offline persistence is not server acceptance</title><desc id="desc">A local draft is persisted with operation identity K and marked pending. On reconnect the server validates identity and revision. Acceptance reconciles state; conflict preserves the draft for resolution.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176448"/></marker></defs><rect width="900" height="450" rx="14" fill="#f7faf8"/><g font-family="system-ui, -apple-system, sans-serif"><text x="28" y="36" font-size="22" fill="#20362c" text-anchor="start" font-weight="650">Offline persistence is not server acceptance</text><rect x="25" y="90" width="180" height="95" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="115.0" y="120" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">Local draft</text><text x="115.0" y="147" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">persist with K</text><rect x="265" y="90" width="180" height="95" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="355.0" y="120" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">Pending sync</text><text x="355.0" y="147" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">same operation K</text><rect x="505" y="90" width="180" height="95" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="595.0" y="120" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">Server decision</text><text x="595.0" y="147" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">auth + revision</text><path d="M205 138 L265 138" fill="none" stroke="#176448" stroke-width="2" marker-end="url(#arrow)"/><path d="M445 138 L505 138" fill="none" stroke="#176448" stroke-width="2" marker-end="url(#arrow)"/><rect x="650" y="260" width="220" height="95" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="760.0" y="290" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">Accepted</text><text x="760.0" y="317" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">reconcile + remove K</text><rect x="345" y="260" width="220" height="95" rx="10" fill="#fff1e5" stroke="#b5c8bd" stroke-width="1.5"/><text x="455.0" y="290" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">Conflict</text><text x="455.0" y="317" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">retain draft + resolve</text><path d="M595 185 L595 220 L760 220 L760 260" fill="none" stroke="#176448" stroke-width="2" marker-end="url(#arrow)"/><path d="M595 220 L455 220 L455 260" fill="none" stroke="#176448" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="407" font-size="17" fill="#52685d" text-anchor="middle" font-weight="400">A lost acknowledgement retries K; a fresh ID would represent a new operation.</text></g></svg>
