<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" aria-labelledby="title desc"><title id="title">Desired state is reconciled, not executed atomically</title><desc id="desc">Deployment and ReplicaSet controllers create desired Pods. A scheduler assigns nodes; kubelets run containers. Status feeds back through the API.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#53684c"/></marker></defs><rect width="760" height="410" fill="#fff"/><text x="30" y="37" font-family="system-ui,sans-serif" font-size="19" font-weight="600" fill="#253a24">Desired state is reconciled, not executed atomically</text><rect x="30" y="85" width="190" height="75" rx="7" fill="#f2f5ec" stroke="#b6c7ab"/><text x="125.0" y="114" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#253a24">API objects</text><text x="125.0" y="137" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">desired + status</text><rect x="285" y="85" width="210" height="75" rx="7" fill="#f2f5ec" stroke="#b6c7ab"/><text x="390.0" y="114" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#253a24">Controllers</text><text x="390.0" y="137" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">Deployment / ReplicaSet</text><rect x="550" y="85" width="180" height="75" rx="7" fill="#f2f5ec" stroke="#b6c7ab"/><text x="640.0" y="114" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#253a24">Pending Pods</text><text x="640.0" y="137" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">desired replicas</text><rect x="550" y="270" width="180" height="75" rx="7" fill="#f2f5ec" stroke="#b6c7ab"/><text x="640.0" y="299" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#253a24">Scheduler</text><text x="640.0" y="322" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">node assignment</text><rect x="285" y="270" width="210" height="75" rx="7" fill="#f2f5ec" stroke="#b6c7ab"/><text x="390.0" y="299" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#253a24">Kubelet / runtime</text><text x="390.0" y="322" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">actual containers</text><path d="M220 122H283" fill="none" stroke="#53684c" stroke-width="1.7" marker-end="url(#arrow)"/><text x="250" y="106" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">watch</text><path d="M495 122H548" fill="none" stroke="#53684c" stroke-width="1.7" marker-end="url(#arrow)"/><text x="520" y="106" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">create</text><path d="M640 160V268" fill="none" stroke="#53684c" stroke-width="1.7" marker-end="url(#arrow)"/><text x="690" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">place</text><path d="M550 307H497" fill="none" stroke="#53684c" stroke-width="1.7" marker-end="url(#arrow)"/><text x="522" y="291" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">bind</text><path d="M285 307H125V162" fill="none" stroke="#53684c" stroke-width="1.7" marker-end="url(#arrow)"/><text x="172" y="288" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#53684c">report observed status</text></svg>