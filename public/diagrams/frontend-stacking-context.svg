<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">A high child z-index cannot escape its context</title><desc id="desc">A menu with z-index 99999 remains inside a card stacking context at level 1. An overlay context at level 2 is above it regardless of the menu child value.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#176448"/></marker></defs><rect width="900" height="430" rx="14" fill="#f7faf8"/><g font-family="system-ui, -apple-system, sans-serif"><text x="28" y="36" font-size="22" fill="#20362c" text-anchor="start" font-weight="650">A high child z-index cannot escape its context</text><rect x="35" y="83" width="390" height="250" rx="12" fill="#eef3f0" stroke="#b5c8bd"/><text x="230" y="120" font-size="21" fill="#20362c" text-anchor="middle" font-weight="600">Card context: z-index 1</text><rect x="72" y="160" width="315" height="110" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="229.5" y="190" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">Menu: z-index 99999</text><text x="229.5" y="217" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">Still inside the card context</text><rect x="475" y="83" width="390" height="250" rx="12" fill="#e5f1e9" stroke="#176448" stroke-width="2"/><text x="670" y="120" font-size="21" fill="#20362c" text-anchor="middle" font-weight="600">Overlay context: z-index 2</text><rect x="512" y="160" width="315" height="110" rx="10" fill="#eaf4ee" stroke="#b5c8bd" stroke-width="1.5"/><text x="669.5" y="190" font-size="19" fill="#20362c" text-anchor="middle" font-weight="600">Dialog contents</text><text x="669.5" y="217" font-size="16" fill="#52685d" text-anchor="middle" font-weight="400">Ordered above the card context</text><path d="M425 208 L475 208" fill="none" stroke="#176448" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="370" font-size="18" fill="#52685d" text-anchor="middle" font-weight="400">Compare parent stacking contexts before comparing their descendants.</text><text x="450" y="395" font-size="18" fill="#52685d" text-anchor="middle" font-weight="400">Clipping by overflow is a separate constraint.</text></g></svg>
