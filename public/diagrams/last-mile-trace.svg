<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-labelledby="title description">
<title id="title">Follow one request</title><desc id="description">A request trace contains an API span with overlapping cache and database child spans. A latency histogram shows the broader distribution instead of only one request.</desc>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#704f4b" opacity=".09"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="m1 1 8 4-8 4" fill="none" stroke="#704f4b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#704f4b}.label{font-size:21px;font-weight:500}.small{font-size:17px}.mono{font:18px 'Courier New',monospace}.number{font:22px 'Courier New',monospace}.ghost-number{font:22px 'Courier New',monospace;fill:#704f4b;opacity:.3}.heading{font-size:18px;letter-spacing:.1px}.emphasis{font-weight:700}.panel{fill:#fcfdf9;stroke:#704f4b;stroke-width:1.5}.wash{fill:#e8d4cb;stroke:#704f4b;stroke-width:1.2}.faint{fill:#f4ece9;stroke:#704f4b;stroke-opacity:.17;stroke-width:1.2}.selected{fill:#d6afa1;stroke:#704f4b;stroke-width:1.5}.solid{fill:#704f4b}.muted-fill{fill:#704f4b;opacity:.35}.accent-fill{fill:#d6afa1}.shadow{fill:#704f4b;opacity:.07;stroke:none}.wire,.hair,.outcome,.grid{fill:none;stroke:#704f4b;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.hair{stroke-width:1;opacity:.55}.grid{stroke-width:1;opacity:.12}.dashed{stroke-dasharray:5 6}.outcome{stroke:#4c706c;stroke-width:3}</style>
<rect width="600" height="340" rx="10" fill="#f4ece9"/><rect x="18" y="63" width="564" height="258" fill="url(#dots)"/>
<text x="29" y="36" class="heading" text-anchor="start">Follow one request</text><path d="M29 51H571V51" class="hair"/>
<text x="42" y="91" class="mono" text-anchor="start">trace: 7f3a</text><text x="333" y="91" class="small" text-anchor="start">latency distribution</text><path d="M148 114v158M204 114v158M260 114v158M316 114v158" class="grid"/><text x="35" y="143" class="small" text-anchor="start">API</text><rect x="106" y="121" width="201" height="30" rx="3" class="wash"/><text x="35" y="200" class="small" text-anchor="start">cache</text><rect x="127" y="177" width="48" height="27" rx="3" class="accent-fill"/><text x="35" y="253" class="small" text-anchor="start">DB</text><rect x="154" y="230" width="128" height="27" rx="3" class="selected"/><path d="M106 155v34h14M106 189v54h40" class="hair"/><text x="107" y="297" class="small" text-anchor="start">0</text><text x="306" y="297" class="small" text-anchor="end">200 ms</text><path d="M355 263h207M355 263v-143" class="wire"/><rect x="367" y="241" width="15" height="21" rx="1" class="wash"/><rect x="390" y="205" width="15" height="57" rx="1" class="wash"/><rect x="413" y="160" width="15" height="102" rx="1" class="wash"/><rect x="436" y="144" width="15" height="118" rx="1" class="wash"/><rect x="459" y="180" width="15" height="82" rx="1" class="wash"/><rect x="482" y="215" width="15" height="47" rx="1" class="wash"/><rect x="505" y="236" width="15" height="26" rx="1" class="accent-fill"/><rect x="528" y="249" width="15" height="13" rx="1" class="accent-fill"/><text x="461" y="297" class="small" text-anchor="middle">requests by duration</text>
</svg>
