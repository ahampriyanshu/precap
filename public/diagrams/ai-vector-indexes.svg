<g font-family="system-ui,-apple-system,sans-serif">
<text x="28" y="36" fill="#172033" font-size="21" font-weight="650">Vector indexes trade search work for geometric recall</text>
<rect x="28" y="70" width="264" height="315" rx="10" fill="white" stroke="#cbd5e1"/>
<text x="160.0" y="97" text-anchor="middle" fill="#172033" font-size="17" font-weight="650">Exact scan</text>
<text x="160.0" y="121" text-anchor="middle" fill="#526176" font-size="15">Compare every candidate</text>
<text x="160.0" y="143" text-anchor="middle" fill="#526176" font-size="15">Baseline: O(N × dimensions)</text>
<rect x="318" y="70" width="264" height="315" rx="10" fill="white" stroke="#cbd5e1"/>
<text x="450.0" y="97" text-anchor="middle" fill="#172033" font-size="17" font-weight="650">Graph navigation</text>
<text x="450.0" y="121" text-anchor="middle" fill="#526176" font-size="15">Follow promising neighbors</text>
<text x="450.0" y="143" text-anchor="middle" fill="#526176" font-size="15">More exploration → more work</text>
<rect x="608" y="70" width="264" height="315" rx="10" fill="white" stroke="#cbd5e1"/>
<text x="740.0" y="97" text-anchor="middle" fill="#172033" font-size="17" font-weight="650">Coarse partitions</text>
<text x="740.0" y="121" text-anchor="middle" fill="#526176" font-size="15">Search selected cells</text>
<text x="740.0" y="143" text-anchor="middle" fill="#526176" font-size="15">More probes → more work</text>
