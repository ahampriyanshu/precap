<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
<title id="title">Vector indexes trade search work for geometric recall</title><desc id="desc">Three panels show exact search across every vector, graph traversal through selected neighbors, and inverted-file search through selected coarse partitions. Compare approximate results with an exact baseline.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#526176"/></marker></defs>
